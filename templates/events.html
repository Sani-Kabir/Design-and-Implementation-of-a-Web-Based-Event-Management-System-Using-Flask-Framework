<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | Event Management System</title>
    <link rel="stylesheet" href="{{url_for('static', filename='css/styles.css')}}">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            width: 90%;
            margin: 20px auto;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
        }
        .events-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }
        .event-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .event-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }
        .events-grid a{
            text-decoration: none;
            font-style: oblique;
        }
        .event-card p {
            display: block;
            margin-top: 10px;
            
            color: #007BFF;
            font-weight: bold;
        }
        header {
    background-color: #333;
    color: white;
    padding: 15px;
    text-align: center;
}
nav a {
    color: white;
    text-decoration: none;
    margin: 0 15px;
}
        @media (max-width: 768px) {
            .events-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 480px) {
            .events-grid {
                grid-template-columns: repeat(1, 1fr);
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>All Events</h1>
        <nav>
            <a href="/">Home</a>
            {% if user %}
            <a href="/dashboard/{{user}}">Dashboard</a>
            {% endif %}
            
            {% if user %}
            <a href="/login">Logout</a>
            {% endif %}

        </nav>
    </header>

    <div class="container">
        <h2>Browse Events</h2>
        <div class="events-grid">
            {% if events %}
                {% for event in events %}
                    
                        <a href="/view-event/{{event['id']}}?user={{user}}">
                            <div class="event-card">
                            <img src="{{url_for('static', filename='img/AI.png')}}" alt="Event 1">
                            <p>{{event['name']}}</p>
                            </div>
                        </a>

                {% endfor %}
            {% endif %}
