<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer Profile</title>
    <style>
        /* Global Styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            padding: 1rem;
            text-align: center;
            color: white;
        }
        nav ul {
            list-style: none;
            padding: 0;
        }
        nav ul li {
            display: inline;
            margin: 0 1rem;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
        }
        .container {
            padding: 2rem;
        }
        .profile-card {
            background-color: #fff;
            padding: 2rem;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 0 auto;
        }
        .profile-card h2 {
            margin-top: 0;
            color: #333;
        }
        .profile-card p {
            margin: 0.5rem 0;
        }
        .profile-card label {
            font-weight: bold;
        }
        .profile-card input, .profile-card textarea {
            width: 100%;
            padding: 0.5rem;
            margin: 0.5rem 0 1rem 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .profile-card button {
            background-color: #333;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .profile-card button:hover {
            background-color: #333;
        }
    </style>
</head>
<body>
    <header>
        <h1>Organizer Profile</h1>
        <nav>
            <ul>
                <li><a href="/event-organizer/{{data['username']}}" class="active">Dashboard</a></li>
                <li><a href="/event-organizer/create-event/{{data['username']}}">Create Event</a></li>
                <li><a href="/event-organizer/manage-events/{{data['username']}}">Manage Events</a></li>
                <li><a href="/event-organizer/profile/{{data['username']}}">Profile</a></li>
                <li><a href="/">Logout</a></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <div class="profile-card">
            <h2>Personal Information</h2>
            <form action="#" method="post">
                <label for="full_name">Full Name:</label>
                <input type="text" id="full_name" name="name" value="{{data['name']}}" required>

                <label for="email">Username:</label>
                <input type="text" id="username" name="username" value="{{data['username']}}" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" value="{{data['email']}}" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" value="{{data['tel']}}" required>
                
                <label for="bio">Bio:</label>
                <textarea id="bio" name="bio" rows="4" required>Experienced event organizer with a passion for creating memorable events.</textarea>

                <label for="email">Password:</label>
                <input type="password" id="password" name="password" value="{{data['password']}}" required>

                <button type="submit">Update Profile</button>
            </form>
        </div>
    </div>
</body>
</html>
